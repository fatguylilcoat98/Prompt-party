# Log rotation for the file-logging variant (only needed if you change
# the systemd unit to StandardOutput=append:/var/log/prompt-party/app.log;
# journald and Docker both rotate on their own).
#
# Install: sudo cp deploy/logrotate.conf /etc/logrotate.d/prompt-party

/var/log/prompt-party/*.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0640 promptparty promptparty
}
