<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prompt Party — Broadcast</title>
<style>
  /* 16:9 OBS-capturable stream view. No controls, no secrets. */
  :root { --bg:#12002b; --panel:#1f0f3dee; --accent:#ff2fb3; --gold:#ffd166;
          --blue:#2fb3ff; --ok:#3fd97b; --text:#fff; --dim:#b9a3e3; }
  * { box-sizing:border-box; margin:0; }
  body { background:radial-gradient(circle at 50% -20%, #35125f, var(--bg));
         color:var(--text); font-family:"Segoe UI",system-ui,sans-serif;
         width:100vw; height:56.25vw; max-height:100vh; max-width:177.78vh;
         margin:auto; overflow:hidden; display:flex; flex-direction:column; }
  header { display:flex; justify-content:space-between; align-items:center; padding:1vw 2vw; }
  header h1 { font-size:2.6vw; letter-spacing:.3vw; color:var(--accent);
              text-shadow:0 0 1.5vw #ff2fb377; }
  #game-title { font-size:1.3vw; color:var(--dim); letter-spacing:.15vw; text-transform:uppercase; }
  #phase { font-size:1.3vw; background:var(--panel); padding:.5vw 1.4vw; border-radius:2vw;
           border:1px solid var(--accent); text-transform:uppercase; letter-spacing:.1vw; }
  #powerup { position:absolute; top:16%; left:50%; transform:translateX(-50%) scale(0);
             background:linear-gradient(135deg,#7b3fd9,var(--accent)); padding:1vw 3vw;
             border-radius:1vw; font-size:2vw; font-weight:800; z-index:9;
             transition:transform .35s cubic-bezier(.2,1.6,.4,1); box-shadow:0 0 3vw #ff2fb388; }
  #powerup.show { transform:translateX(-50%) scale(1); }
  #prompt { text-align:center; font-size:1.9vw; padding:.4vw 6vw; color:var(--gold);
            min-height:2.6vw; font-weight:600; }
  main { flex:1; display:flex; gap:1.2vw; padding:0 2vw; min-height:0; }
  .stage { flex:1; display:flex; gap:1.2vw; min-height:0; }
  .panel { background:var(--panel); border-radius:1vw; padding:1vw; overflow:hidden;
           display:flex; flex-direction:column; border:1px solid #3a2a63; }
  .canvas { flex:1; align-items:center; justify-content:center; position:relative; }
  .canvas img { max-width:100%; max-height:78%; border-radius:.6vw;
                opacity:0; transform:scale(.92); transition:opacity .8s, transform .8s; }
  .canvas img.revealed { opacity:1; transform:scale(1); }
  .canvas .name { font-size:1.5vw; padding:.5vw; font-weight:700; }
  .canvas .status { font-size:1.15vw; color:var(--dim); font-style:italic; text-align:center; }
  .pulse { animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.45; } }
  #dialogue { flex:2; overflow-y:hidden; }
  #dialogue .line { margin:.4vw 0; padding:.6vw .9vw; background:#160833aa; border-radius:.6vw;
                    font-size:1.25vw; animation:slidein .4s ease-out; }
  #dialogue .line b { color:var(--blue); }
  #dialogue .line.blocked { color:var(--dim); font-style:italic; }
  @keyframes slidein { from { opacity:0; transform:translateY(1vw);} }
  #side { width:26%; display:flex; flex-direction:column; gap:1.2vw; }
  #scoreboard .row { display:flex; justify-content:space-between; font-size:1.25vw; padding:.25vw 0; }
  #scoreboard .bar { height:.8vw; background:#160833; border-radius:.4vw; overflow:hidden; margin-bottom:.5vw; }
  #scoreboard .bar > div { height:100%; background:linear-gradient(90deg,var(--blue),var(--accent));
                           width:0; transition:width 1.2s ease; }
  #cast { font-size:1.05vw; color:var(--dim); }
  #cast b { color:var(--text); }
  footer { min-height:6.5vw; padding:.6vw 2vw 1vw; display:flex; flex-direction:column; gap:.3vw; }
  #commentary { font-size:1.35vw; color:#e8dcff; min-height:2vw; font-style:italic;
                transition:opacity .4s; }
  #commentary b { color:var(--gold); font-style:normal; }
  #commentary.swap { opacity:0; }
  #stinger { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
             pointer-events:none; z-index:8; }
  #stinger span { font-size:6vw; font-weight:900; letter-spacing:.4vw; color:#fff;
    text-shadow:0 0 3vw var(--accent); opacity:0; transform:scale(2) rotate(-4deg); }
  #stinger.show span { animation:stinger 1.6s ease-out; }
  @keyframes stinger {
    0% { opacity:0; transform:scale(2.4) rotate(-6deg); }
    12% { opacity:1; transform:scale(1) rotate(-2deg); }
    80% { opacity:1; transform:scale(1.05) rotate(-2deg); }
    100% { opacity:0; transform:scale(1.1); } }
  .dots::after { content:""; animation:dots 1.5s steps(4) infinite; }
  @keyframes dots { 0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."} }
  .countup { transition:none; }
  #votebar { display:flex; height:2vw; border-radius:1vw; overflow:hidden; font-size:1vw; }
  #votebar div { display:flex; align-items:center; justify-content:center;
                 transition:flex 1s ease; white-space:nowrap; overflow:hidden; }
  #countdown { position:absolute; right:3%; top:14%; font-size:4.5vw; font-weight:900;
               color:var(--gold); text-shadow:0 0 2vw #ffd16688; }
  #winner-overlay { position:absolute; inset:0; display:none; align-items:center; flex-direction:column;
    justify-content:center; background:#12002bcc; z-index:10; }
  #winner-overlay.show { display:flex; animation:flash .6s; }
  #winner-overlay .crown { font-size:7vw; }
  #winner-overlay .who { font-size:5vw; font-weight:900; color:var(--gold);
                         text-shadow:0 0 3vw #ffd166aa; }
  @keyframes flash { 0% { background:#fff; } }
  .fictional { font-size:.9vw; color:var(--dim); text-align:center; letter-spacing:.1vw; }
</style>
</head>
<body>
<header>
  <div><h1>PROMPT PARTY</h1><div id="game-title"></div></div>
  <div id="phase">LOBBY</div>
</header>
<div id="powerup"></div>
<div id="countdown"></div>
<div id="prompt"></div>
<main>
  <div class="stage" id="stage"></div>
  <div id="side">
    <div class="panel" id="scoreboard"><div class="name" style="font-size:1.1vw;color:var(--dim)">SCOREBOARD</div><div id="score-rows"></div></div>
    <div class="panel" id="cast-panel"><div class="name" style="font-size:1.1vw;color:var(--dim)">CAST</div><div id="cast"></div></div>
  </div>
</main>
<footer>
  <div id="commentary"></div>
  <div id="votebar"></div>
  <div id="fictional" class="fictional"></div>
</footer>
<div id="winner-overlay"><div class="crown">👑</div><div class="who"></div></div>
<div id="stinger"><span></span></div>
<script>
const showId = new URLSearchParams(location.search).get("show");
const $ = id => document.getElementById(id);
let lastPhase = null, revealedSet = new Set(), lastPowerup = null, countdownTimer = null,
    winnerShown = null;

async function tick() {
  if (!showId) { $("prompt").textContent = "Add ?show=<show_id> to the URL"; return; }
  const res = await fetch(`/api/shows/${showId}/broadcast-state`);
  if (!res.ok) return;
  render(await res.json());
}
function render(state) {
  const round = state.round;
  $("phase").textContent = round ? round.phase.replaceAll("_"," ") : state.status.toUpperCase();
  if (!round) return;
  $("game-title").textContent = (round.game_id||"").replaceAll("_"," ");
  $("prompt").textContent = round.locked_prompt || "";
  $("fictional").textContent = round.game_id === "ai_court"
    ? "ALL CASES, EVIDENCE, AND RULINGS ARE FICTIONAL ENTERTAINMENT" : "";
  renderCast(round);
  renderStage(round);
  renderScores(round);
  renderVotes(round.voting);
  renderWinner(round);
}
function renderCast(round) {
  $("cast").innerHTML = (round.cast||[]).map(p =>
    `<div><b>${p.display_name}</b> · ${p.seat_type}</div>`).join("");
}
function renderStage(round) {
  const stage = $("stage");
  const game = round.game_id, gs = round.game_state || {};
  if (game === "art_showdown") {
    stage.innerHTML = "";
    const revealedBy = Object.fromEntries((round.revealed||[]).map(r=>[r.artist_id, r.url]));
    for (const p of (round.cast||[]).filter(c=>c.seat_type==="contestant")) {
      const div = document.createElement("div");
      div.className = "panel canvas";
      const gen = (round.generation||{})[p.participant_id] || {};
      const revealed = revealedBy[p.participant_id];
      div.innerHTML = `<div class="name">${p.display_name}</div>` +
        (revealed ? `<img src="${revealed}">`
                  : `<div class="status ${gen.status==="generating"?"pulse dots":""}">${gen.label||"Waiting in the wings…"}</div>`);
      stage.appendChild(div);
      const img = div.querySelector("img");
      if (img) requestAnimationFrame(()=>requestAnimationFrame(()=>img.classList.add("revealed")));
    }
    updateCommentaryPool((round.commentary||[]).map(c =>
      `<b>${c.judge_id}</b> ${c.comment.comment}`));
  } else if (game === "rap_battle") {
    renderDialogue((gs.verses||[]).slice(-3).map(v =>
      `<div class="line"><b>${v.rapper_id}</b><br>${(v.verse.bars||[]).join("<br>")}</div>`));
  } else if (game === "roast_battle") {
    renderDialogue((gs.turns||[]).slice(-4).map(t =>
      t.status === "published"
        ? `<div class="line"><b>${t.roaster_id}</b> ${t.turn.roast}</div>`
        : `<div class="line blocked">🔇 a roast was bleeped and benched</div>`));
  } else if (game === "ai_court") {
    const turns = (gs.turns||[]).slice(-4).map(t =>
      `<div class="line ${t.struck?"blocked":""}"><b>${t.role}</b> ${t.output.spoken_line}${t.struck?" <i>(struck)</i>":""}</div>`);
    const objections = (gs.objections||[]).filter(o=>o.status==="pending").map(o =>
      `<div class="line" style="color:var(--gold)">OBJECTION (${o.type}): ${o.statement}</div>`);
    renderDialogue([...turns, ...objections]);
    if (gs.final_ruling) $("commentary").innerHTML = `<b>THE COURT</b> ${gs.final_ruling.opinion}`;
  } else if (game === "improv") {
    const scene = gs.scene;
    const header = scene ? `<div class="line" style="color:var(--dim)">📍 ${scene.location} · ${scene.genre}</div>` : "";
    renderDialogue([header, ...(gs.turns||[]).slice(-4).map(t =>
      `<div class="line"><b>${t.character}</b> ${t.turn.spoken_line}</div>`)]);
  } else {
    stage.innerHTML = `<div class="panel canvas"><div class="status">Show is warming up…</div></div>`;
  }
}
function renderDialogue(lines) {
  $("stage").innerHTML = `<div class="panel" id="dialogue">${lines.join("")}</div>`;
}
let scoreShown = {};
function renderScores(round) {
  const rows = [];
  const scores = round.judge_scores || {};
  const totals = {};
  for (const card of Object.values(scores)) {
    for (const [id, cats] of Object.entries(card.scores || {})) {
      totals[id] = (totals[id] || 0) + (cats.total || 0);
    }
  }
  const max = Math.max(1, ...Object.values(totals));
  for (const [id, total] of Object.entries(totals)) {
    rows.push(`<div class="row"><span>${id}</span><b class="countup" data-id="${id}" data-target="${total}">${scoreShown[id]||0}</b></div>
      <div class="bar"><div style="width:${(total/max*100).toFixed(0)}%"></div></div>`);
  }
  $("score-rows").innerHTML = rows.join("") || `<div class="status dots" style="font-size:1vw;color:var(--dim)">Judges are sharpening pencils</div>`;
  // Count the numbers up toward their targets — scores land like a
  // scoreboard, not a spreadsheet.
  for (const el of document.querySelectorAll(".countup")) {
    const id = el.dataset.id, target = parseInt(el.dataset.target);
    let current = scoreShown[id] || 0;
    if (current === target) continue;
    const step = () => {
      current = Math.min(target, current + Math.max(1, Math.round((target-current)/6)));
      el.textContent = current; scoreShown[id] = current;
      if (current < target) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
}
// Rotating commentary ticker: during waits, judge banter cycles with a
// gentle crossfade instead of sitting frozen on the last line.
let commentaryPool = [], commentaryIndex = 0, commentaryTimer = null;
function updateCommentaryPool(lines) {
  const changed = JSON.stringify(lines) !== JSON.stringify(commentaryPool);
  commentaryPool = lines;
  if (!commentaryPool.length) { $("commentary").innerHTML = ""; return; }
  if (changed) { commentaryIndex = commentaryPool.length - 1; swapCommentary(commentaryPool[commentaryIndex]); }
  if (!commentaryTimer) {
    commentaryTimer = setInterval(() => {
      if (commentaryPool.length > 1) {
        commentaryIndex = (commentaryIndex + 1) % commentaryPool.length;
        swapCommentary(commentaryPool[commentaryIndex]);
      }
    }, 7000);
  }
}
function swapCommentary(html) {
  const el = $("commentary");
  el.classList.add("swap");
  setTimeout(() => { el.innerHTML = html; el.classList.remove("swap"); }, 400);
}
let stingerBusy = false;
function stinger(text) {
  if (stingerBusy) return;
  stingerBusy = true;
  const wrap = $("stinger");
  wrap.querySelector("span").textContent = text;
  wrap.classList.add("show");
  setTimeout(() => { wrap.classList.remove("show"); stingerBusy = false; }, 1700);
}
function renderVotes(voting) {
  const bar = $("votebar");
  if (voting && (voting.status === "open" || voting.status === "closed")) {
    const tally = voting.tally || Object.fromEntries(voting.choices.map(c=>[c,0]));
    const palette = ["#ff2fb3","#2fb3ff","#ffd166","#3fd97b"];
    bar.innerHTML = Object.entries(tally).map(([k,v],i) =>
      `<div style="flex:${(v||0)+.001};background:${palette[i%4]}">${k.replaceAll("_"," ")} ${voting.status==="closed"?v:""}</div>`).join("");
    if (voting.status === "open") startCountdown(voting); else stopCountdown();
  } else { bar.innerHTML = ""; stopCountdown(); }
}
function startCountdown(voting) {
  if (!voting.countdown_seconds || !voting.opened_at || countdownTimer) return;
  const endAt = new Date(voting.opened_at).getTime() + voting.countdown_seconds*1000;
  countdownTimer = setInterval(() => {
    const left = Math.max(0, Math.round((endAt - Date.now())/1000));
    $("countdown").textContent = left > 0 ? left : "";
    if (left <= 0) stopCountdown();
  }, 250);
}
function stopCountdown() {
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = null; $("countdown").textContent = "";
}
function renderWinner(round) {
  const winner = round.result?.winner_id;
  if (winner && winner !== winnerShown && round.phase === "SCORING") {
    winnerShown = winner;
    $("winner-overlay").querySelector(".who").textContent = winner.replaceAll("_"," ").toUpperCase();
    $("winner-overlay").classList.add("show");
    setTimeout(()=>$("winner-overlay").classList.remove("show"), 6000);
  }
}
function flashPowerup(name) {
  const el = $("powerup");
  el.textContent = `⚡ ${name.replaceAll("_"," ").toUpperCase()}`;
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"), 4000);
}
function openStream() {
  if (!showId) return;
  const sse = new EventSource(`/api/shows/${showId}/events/stream`);
  const refresh = ["round.phase_changed","round.phase_overridden","prompt.locked","artwork.revealed",
    "verse.published","verse.recovery","roast.published","roast.blocked","scene.line","trial.turn",
    "objection.raised","objection.ruled","judge.commentary_created","judge.scorecard_created",
    "vote.opened","vote.closed","round.winner_calculated","round.winner_overridden",
    "generation.status","court.final_ruling","round.created","scene.player_frozen"];
  for (const type of refresh) sse.addEventListener(type, tick);
  sse.addEventListener("modifier.applied", e => {
    flashPowerup(JSON.parse(e.data).payload.modifier_id || "power-up"); tick();
  });
  // Clip-worthy moment stingers, straight off the event stream.
  const STINGERS = {
    "prompt.locked": "PROMPT LOCKED",
    "artwork.revealed": "REVEAL",
    "vote.opened": "VOTE NOW",
    "vote.closed": "VOTES ARE IN",
    "objection.raised": "OBJECTION!",
    "roast.blocked": "BENCHED 🔇",
    "verse.recovery": "LOST THE BEAT",
    "scene.player_frozen": "FROZEN",
    "scene.bell": "🔔 RULE BREAK",
    "judge.recused": "RECUSED",
    "round.winner_overridden": "PRODUCER'S CALL",
  };
  for (const [type, text] of Object.entries(STINGERS)) {
    sse.addEventListener(type, () => { stinger(text); tick(); });
  }
}
openStream();
setInterval(tick, 5000);
tick();
</script>
</body>
</html>
