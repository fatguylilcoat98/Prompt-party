<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Party — Join the Show</title>
<style>
  :root { --bg:#12002b; --panel:#1f0f3d; --accent:#ff2fb3; --gold:#ffd166;
          --ok:#3fd97b; --text:#f3eefc; --dim:#b9a3e3; }
  * { box-sizing:border-box; margin:0; font-family:"Segoe UI",system-ui,sans-serif; }
  body { background:radial-gradient(circle at top, #240a4a, var(--bg)); color:var(--text);
         min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { color:var(--accent); letter-spacing:2px; font-size:26px; margin:12px 0; text-align:center; }
  .card { background:var(--panel); border-radius:16px; padding:18px; margin:8px 0;
          width:100%; max-width:480px; box-shadow:0 8px 30px rgba(0,0,0,.4); }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin-bottom:10px; }
  input, button, textarea { border-radius:10px; border:1px solid #3a2a63; background:#160833;
    color:var(--text); padding:10px 12px; font-size:15px; width:100%; margin:4px 0; }
  button { background:var(--accent); border:none; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  button.vote { background:#2fb3ff; margin:6px 0; font-size:17px; padding:14px; transition:transform .1s; }
  button.vote:active { transform:scale(.97); }
  button.vote.picked { outline:3px solid var(--gold); }
  #phase { text-align:center; color:var(--gold); font-size:15px; min-height:22px; }
  #prompt { text-align:center; font-size:17px; margin:6px 0; }
  #countdown { text-align:center; font-size:34px; color:var(--gold); font-weight:800; min-height:20px; }
  #winner { text-align:center; font-size:22px; color:var(--gold); font-weight:800; }
  #scores { font-size:14px; }
  .note { color:var(--dim); font-size:12px; text-align:center; }
  #ticker { font-size:13px; color:var(--dim); max-height:120px; overflow-y:auto; }
  .hidden { display:none; }
</style>
</head>
<body>
<h1>PROMPT PARTY</h1>
<div class="card" id="join-card">
  <h2>Join the audience</h2>
  <input id="show-id" placeholder="show code (from the stream)">
  <input id="nickname" placeholder="your nickname" maxlength="40">
  <button onclick="join()">Join the show</button>
  <div class="note">You suggest, you vote — the producer approves everything before it hits the stage.</div>
</div>

<div id="playing" class="hidden" style="width:100%;max-width:480px">
  <div class="card">
    <div id="phase">…</div>
    <div id="game-name" class="note"></div>
    <div id="prompt"></div>
    <div id="countdown"></div>
  </div>
  <div class="card" id="submit-card">
    <h2>Send an idea</h2>
    <textarea id="idea" rows="2" maxlength="280" placeholder="your prompt / topic / suggestion"></textarea>
    <button id="submit-btn" onclick="submitIdea('scene_prompt')">Submit idea</button>
    <button id="powerup-btn" onclick="submitIdea('powerup_suggestion')" style="background:#7b3fd9">Suggest a power-up</button>
    <div id="submit-note" class="note"></div>
  </div>
  <div class="card" id="vote-card">
    <h2>Vote</h2>
    <div id="ballot"><div class="note">Voting hasn’t opened yet.</div></div>
  </div>
  <div class="card">
    <h2>Results</h2>
    <div id="winner"></div>
    <div id="scores"></div>
  </div>
  <div class="card"><h2>Show feed</h2><div id="ticker"></div></div>
</div>
<script>
let showId = null, session = null, currentRound = null, myVote = null, sse = null, countdownTimer = null;
const $ = id => document.getElementById(id);

const urlShow = new URLSearchParams(location.search).get("show");
if (urlShow) $("show-id").value = urlShow;

async function join() {
  showId = $("show-id").value.trim();
  const nickname = $("nickname").value.trim() || "guest";
  const res = await fetch(`/api/shows/${showId}/audience/join`, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({display_name:nickname}),
  });
  if (!res.ok) { alert("Could not join — check the show code."); return; }
  session = await res.json();
  $("join-card").classList.add("hidden");
  $("playing").classList.remove("hidden");
  openStream(); refresh();
  setInterval(refresh, 4000);
}
async function refresh() {
  const res = await fetch(`/api/shows/${showId}/broadcast-state`);
  if (!res.ok) return;
  const state = await res.json();
  const round = state.round;
  if (!round) { $("phase").textContent = "Waiting for the show to start…"; return; }
  currentRound = round.round_id;
  $("phase").textContent = round.phase.replaceAll("_"," ");
  $("game-name").textContent = round.game_id.replaceAll("_"," ");
  $("prompt").textContent = round.locked_prompt || "";
  const canSubmit = round.phase === "SUBMISSION_OPEN";
  $("submit-btn").disabled = !canSubmit; $("powerup-btn").disabled = !canSubmit;
  $("submit-note").textContent = canSubmit ? "Submissions are open!" : "Submissions open during the submission phase.";
  renderBallot(round.voting);
  renderResults(round);
}
function renderBallot(voting) {
  const ballot = $("ballot");
  if (voting.status === "open") {
    ballot.innerHTML = "";
    for (const choice of voting.choices) {
      const b = document.createElement("button");
      b.className = "vote" + (myVote === choice ? " picked" : "");
      b.textContent = choice.replaceAll("_"," ");
      b.onclick = () => castVote(choice);
      ballot.appendChild(b);
    }
    const note = document.createElement("div");
    note.className = "note"; note.textContent = "You can change your vote until voting closes.";
    ballot.appendChild(note);
    startCountdown(voting);
  } else if (voting.status === "closed" && voting.tally) {
    ballot.innerHTML = `<div class="note">Voting closed.</div>` +
      Object.entries(voting.tally).map(([k,v])=>`<div>${k.replaceAll("_"," ")}: <b>${v}</b></div>`).join("");
    stopCountdown();
  } else {
    ballot.innerHTML = '<div class="note">Voting hasn’t opened yet.</div>';
    stopCountdown();
  }
}
function startCountdown(voting) {
  if (!voting.countdown_seconds || !voting.opened_at) { $("countdown").textContent = ""; return; }
  stopCountdown();
  const endAt = new Date(voting.opened_at).getTime() + voting.countdown_seconds*1000;
  countdownTimer = setInterval(() => {
    const left = Math.max(0, Math.round((endAt - Date.now())/1000));
    $("countdown").textContent = left > 0 ? `⏱ ${left}` : "⏱ time!";
    if (left <= 0) stopCountdown(true);
  }, 250);
}
function stopCountdown(keepText=false) {
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = null;
  if (!keepText) $("countdown").textContent = "";
}
function renderResults(round) {
  const winner = round.result?.winner_id;
  $("winner").textContent = winner ? `🏆 ${winner.replaceAll("_"," ")}` :
    (round.result?.is_draw ? "It’s a draw!" : "");
  const parts = [];
  const components = round.result?.components || {};
  for (const [id, c] of Object.entries(components)) {
    if (c.combined !== undefined)
      parts.push(`${id}: audience ${(c.audience_share*100).toFixed(0)}% · judges ${(c.judge_normalized*100).toFixed(0)}%`);
    else if (c.share !== undefined)
      parts.push(`${id.replaceAll("_"," ")}: ${(c.share*100).toFixed(0)}%`);
  }
  $("scores").innerHTML = parts.map(p=>`<div>${p}</div>`).join("");
}
async function submitIdea(type) {
  const text = $("idea").value.trim();
  if (!text || !currentRound) return;
  const res = await fetch(`/api/rounds/${currentRound}/submissions`, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({session_id:session.session_id, text, submission_type:type}),
  });
  const data = await res.json();
  $("submit-note").textContent = res.ok
    ? "Sent! The producer reviews every idea before it reaches the stage."
    : `Not accepted: ${data.detail}`;
  if (res.ok) $("idea").value = "";
}
async function castVote(choice) {
  const res = await fetch(`/api/rounds/${currentRound}/votes`, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({session_id:session.session_id, choice}),
  });
  const data = await res.json();
  if (res.ok) { myVote = choice; refresh(); }
  else $("ballot").insertAdjacentHTML("beforeend", `<div class="note">${data.detail}</div>`);
}
function openStream() {
  sse = new EventSource(`/api/shows/${showId}/events/stream`);
  const interesting = ["prompt.locked","vote.opened","vote.closed","round.winner_calculated",
    "round.phase_changed","artwork.revealed","verse.published","roast.published","scene.line",
    "trial.turn","judge.commentary_created","modifier.applied"];
  for (const type of interesting) {
    sse.addEventListener(type, e => {
      const data = JSON.parse(e.data);
      const div = document.createElement("div");
      div.textContent = `• ${type.replaceAll("."," ")}`;
      $("ticker").prepend(div);
      while ($("ticker").children.length > 30) $("ticker").removeChild($("ticker").lastChild);
      refresh();
    });
  }
}
</script>
</body>
</html>
